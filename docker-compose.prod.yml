services:
  # Versión web (Streamlit) del analizador. Sirve en su propio subdominio
  # materials-app.fertechnologies.com, con un Traefik dedicado en este mismo
  # servidor (no comparte instancia con la landing de fertechnologies.com,
  # que vive en otro servidor) — por eso es Host() puro, sin PathPrefix ni
  # necesidad de coordinar prioridad con otro router.
  #
  # image: se construye en CI (.github/workflows/deploy-web.yml) y se
  # publica en GHCR — este servidor nunca compila nada, solo hace
  # `docker compose pull` + `up -d`. `build:` queda como fallback manual.
  materialtestapp:
    image: ${MATERIALTESTAPP_IMAGE:-ghcr.io/lsalamancas/material_tests_app-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: material-testapp-web
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.materialtestapp.rule=Host(`materials-app.fertechnologies.com`)"
      - "traefik.http.routers.materialtestapp.entrypoints=websecure"
      - "traefik.http.routers.materialtestapp.tls.certresolver=myresolver"
      - "traefik.http.services.materialtestapp.loadbalancer.server.port=8501"

networks:
  traefik_proxy:
    external: true
