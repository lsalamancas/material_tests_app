name: Deploy Web

# Solo dispara con cambios relevantes a la versión web, para no reconstruir
# y redesplegar la imagen Docker en cada commit que solo toque la app de
# escritorio (PyQt6) — esa sigue su propio flujo en build.yml (tags v*).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "webapp/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-web.yml"

# github.repository ya viene en minúsculas para este repo, pero se computa
# igual de forma explícita (mismo patrón que app_bustral) por si el repo se
# mueve de owner en el futuro — GHCR exige nombres en minúsculas y
# toLower() no está disponible en un bloque env: de nivel de workflow.
env:
  REGISTRY: ghcr.io

jobs:
  repo:
    runs-on: ubuntu-latest
    outputs:
      lower: ${{ steps.lower.outputs.lower }}
    steps:
      - id: lower
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: [repo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEB_IMAGE: ghcr.io/${{ needs.repo.outputs.lower }}-web
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [repo, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          command_timeout: 10m
          timeout: 10m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull

            # PAT de solo lectura de paquetes, igual que en app_bustral —
            # secrets.GITHUB_TOKEN no sirve aquí, solo vive durante este
            # workflow run y no es utilizable desde el servidor por SSH.
            echo "${{ secrets.DEPLOY_GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export MATERIALTESTAPP_IMAGE="ghcr.io/${{ needs.repo.outputs.lower }}-web"
            export IMAGE_TAG="${{ github.sha }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployment successful"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed"
