# Fuerza el tema claro de la app de escritorio (LIGHT_STYLESHEET en
# src/app/ui/styles.py) en vez de seguir el tema oscuro/claro del sistema
# del visitante — la app de escritorio no sigue el tema del SO tampoco,
# arranca siempre en claro con un toggle propio.
[theme]
base = "light"
primaryColor = "#1976D2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#212121"
font = "sans serif"

[browser]
gatherUsageStats = false

# "minimal" oculta el botón "Deploy" y el menú de tres puntos (rerun,
# limpiar caché, "About", etc.) — son opciones de desarrollo de Streamlit
# que no aplican a los usuarios finales de esta app.
[client]
toolbarMode = "minimal"
